[build-system]
requires = ["setuptools>=61,<69"]
build-backend = "setuptools.build_meta"

[project]
name = "rick-tv-pi"
version = "0.1.0"
requires-python = ">=3.7"
dependencies = [
    "httpx>=0.24,<0.25; python_version < '3.8'",
    "httpx; python_version >= '3.8'",
    "PyYAML",
    "evdev; platform_system == 'Linux'",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
