services:
  rick-tv-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      RICK_TV_MEDIA_DIR: /var/lib/rick-tv/media
      RICK_TV_CONFIG_DIR: /etc/rick-tv
      RICK_TV_STATE_DIR: /var/lib/rick-tv/state
      RICK_TV_API_TOKEN: ${RICK_TV_API_TOKEN:-change-me-local}
      RICK_TV_PUBLIC_BASE_URL: ${RICK_TV_PUBLIC_BASE_URL:-http://localhost:8080}
      RICK_TV_CHANNELS_PATH: /etc/rick-tv/channels.yml
    volumes:
      - ./media:/var/lib/rick-tv/media
      - ./config:/etc/rick-tv
      - ./state:/var/lib/rick-tv/state
    restart: unless-stopped

  rick-tv-bot:
    build: .
    command: python -m rick_tv_server.bot_runner
    profiles:
      - bot
    environment:
      RICK_TV_MEDIA_DIR: /var/lib/rick-tv/media
      RICK_TV_CONFIG_DIR: /etc/rick-tv
      RICK_TV_STATE_DIR: /var/lib/rick-tv/state
      RICK_TV_API_TOKEN: ${RICK_TV_API_TOKEN:-change-me-local}
      RICK_TV_PUBLIC_BASE_URL: ${RICK_TV_PUBLIC_BASE_URL:-http://localhost:8080}
      RICK_TV_CHANNELS_PATH: /etc/rick-tv/channels.yml
      RICK_TV_TELEGRAM_BOT_TOKEN: ${RICK_TV_TELEGRAM_BOT_TOKEN:-}
      RICK_TV_TELEGRAM_ALLOWED_USER_IDS: ${RICK_TV_TELEGRAM_ALLOWED_USER_IDS:-}
    volumes:
      - ./media:/var/lib/rick-tv/media
      - ./config:/etc/rick-tv
      - ./state:/var/lib/rick-tv/state
    restart: unless-stopped
